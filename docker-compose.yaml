version: '3.9'

services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345 # Root password for MySQL
      MYSQL_DATABASE: expense-tracker # Create this database at startup
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: # Define a named volume for MySQL data persistence
